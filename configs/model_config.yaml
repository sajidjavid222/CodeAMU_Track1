# CodeAMU - IndoML 2026 Track 1 final system: submission v93_banksyn7
# Leaderboard (Phase 2 final): Event F1 0.7895, Segment Dice 0.8278, Combined 1.6173 (rank 1)
#   natural   clips: F1 0.5197, Dice 0.7256        synthetic clips: F1 0.9981, Dice 0.9966

detectors:                      # checkpoints/detectors/<name>/best.pt; per-model training args: train/configs/detectors.yaml
  frame: 0.02 s (hr_*: 0.01 s, averaged / max-pooled onto the 0.02 s grid)
  heads: [presence, onset (Gaussian bump), offset (Gaussian bump), 7 categories, weak clip tags]
  inference: 10 s windows, 8 s hop, bf16 autocast
  members:
    whisper-large-v3 encoder: [v8_whis_lg_gold, v9_lg3_s21, gv_lg3_A, gv_lg3_B, lg3_full_gold, bg_lg3_syn, bg_lg3_syn_gold]
    whisper-large-v2 encoder: [v9_lg2_gold, lg2_full_gold]
    whisper-medium encoder: [ov_med_syn, gv_med_A, gv_med_B, hr_med_syn, hr_med_syn_gold]
    whisper-small encoder: [bg_sml_syn, gv_sml_A, gv_sml_B]
    wavlm-base-plus: [v4_wavlm_gold]
    beats + whisper-medium hybrid: [rb_beats_gold, beats_full_gold]
    crnn (log-mel, from scratch): [v2_crnn_gold (64 mels, 0.8M), cb_big, cb_s7, cb_s7_gold (crnn_big, 128 mels)]

router:                         # assets/synth_clf.pkl: random forest on background-statistics features
  label: syntheticData flag of the official validation release (2,501 clips)
  threshold: 0.5                # 2,080 / 5,517 test clips routed synthetic

natural_branch:                 # inference/t1_v67_decode.py
  presence_weights: {v8_whis_lg_gold: 1.3, ov_med_syn: 0.8, v2_crnn_gold: 1.0, v9_lg3_s21: 1.3, v4_wavlm_gold: 1.0, bg_sml_syn: 1.0,
                     gv_lg3_A: 1.3, gv_lg3_B: 1.3, gv_med_A: 0.8, gv_med_B: 0.8, gv_sml_A: 1.0, gv_sml_B: 1.0,
                     rb_beats_gold: 1.4, v9_lg2_gold: 0.4, hr_med_syn: 0.0, hr_med_syn_gold: 0.0}
  boundary_weights: {v8_whis_lg_gold: 1.3, ov_med_syn: 0.8, v2_crnn_gold: 1.0, v9_lg3_s21: 1.3, v4_wavlm_gold: 1.0, bg_sml_syn: 1.0,
                     gv_lg3_A: 1.3, gv_lg3_B: 1.3, gv_med_A: 0.8, gv_med_B: 0.8, gv_sml_A: 1.0, gv_sml_B: 1.0,
                     rb_beats_gold: 0.0, v9_lg2_gold: 0.8, hr_med_syn: 0.5, hr_med_syn_gold: 0.2}
  full_gold_blend: 16 x weighted ensemble + 1 x each of [lg3_full_gold, lg2_full_gold, beats_full_gold], / 19
  crnn_blend: [cb_big 0.20, cb_s7 0.15]
  decode: {high: 0.57, low: 0.48, median_k: 3, min_dur: 0.10}
  split_events: {split_thr: 0.16, min_sub: 0.10, max_pair_gap: 0.25}
  duration_snap: {split: 0.45, snap_short: 0.12, peak_short: 0.10, snap_long: 0.32, peak_long: 0.20}
  interior_carving: events >= 0.75 s, onset/offset peak pairs <= 0.65 s
  boundary_regressor: assets/boundary_regressor.pkl (gradient boosting, Huber), offset trim in [-0.20, -0.005] s

synthetic_branch:
  members: [bg_lg3_syn, bg_lg3_syn_gold, cb_s7, cb_s7_gold, gv_lg3_A, gv_lg3_B, gv_med_A, gv_med_B, gv_sml_A, gv_sml_B]
  decode: assets/route_v43.json (syn_params)
  split_events: {split_thr: 0.06, min_sub: 0.10, max_pair_gap: 0.40}
  duration_snap: {split: 0.45, snap_short: 0.12, peak_short: 0.10, snap_long: 0.22, peak_long: 0.20}

noise_bank:                     # inference/bank_match.py; official validation release, noise = mixture - clean at labelled spans
  recordings: 1181              # 2,213 labelled events after de-duplication
  natural_augmented: 4118       # + labelled events of the validation natural clips ("nb" bank)
  matching: {rate_hz: 8000, whitening: pre-emphasis 0.97, candidate_floor: 0.20, peaks_per_template: 3, overlap_reject: 0.30}

refinement_chain:               # inference/run_pipeline.py stage 5
  v69: synthetic events snapped to whitened bank matches (bank_merge V69 rule)
  v70: natural-routed clips with >= 3 matches at cor >= 0.9 rerouted (none on the test set); natural clips merged with
       trusted bank matches (V70_NAT: th 0.7, tol_abs 0.2, tol_rel 0.5)
  v71: natural split_events split_thr 0.17, max_pair_gap 0.30 + collar optimisation
  v74: exact synthetic snaps from the natural-augmented bank
  v76: synthetic exact snaps (cor >= 0.967) + natural duplicate NMS (IoU >= 0.50, duration ratio >= 0.50)
  v80: natural duplicate NMS (IoU >= 0.30, duration ratio >= 0.30)
  v93: natural confidence false-alarm filter (rules c1-c7 on mean/peak presence and edge peaks), NMS (0.29, 0.28),
       steepest-descent offset cut (rate 0.105 over the last 100 ms), collar alignment (+8.5 ms >= 0.45 s, +4 ms shorter)
  banksyn2: synthetic events replaced/added by energy-verified bank spans
  banksyn3: bank-unsupported synthetic events dropped when the Track 2 enhancer removes < -12 dB of their energy
  banksyn4: natural clips - bank spans (cor >= 0.7; 0.6-0.7 and 0.45-0.6 energy-verified) snap / replace / add
  banksyn5: low-correlation (0.30-0.45) bank spans passing a strict energy test (frac >= 0.3)
  banksyn7: every still-empty natural clip gets one event over the natural ensemble's activity envelope (p >= 0.20)

energy_test:                    # inference/t1_bank_extent_probe.py extent(); calibrated on validation (cross-clip copies)
  frame: 10 ms reduction = 10*log10(E_mixture / E_residual) after subtracting the matched template with a fitted gain
  pass: any frame >= 1 dB and mean(first 100 ms, last 100 ms) >= 0 dB (cor 0.45-0.6) / >= -1 dB (cor >= 0.6)
  low_cor_extra: fraction of template frames >= 1 dB at least 0.3 (cor 0.30-0.45)

noise_meter:                    # inference/t1_syn_fp_probe.py
  model: Track 2 TF-DPCRN ensemble (checkpoints/enhancer/t2_model_{0,1,2}.pt), whole-clip window
  statistic: D = 10*log10(E_removed / E_mixture) per 10 ms frame, averaged over the event
  drop_below_db: -12           # bank-span (noise) regions: median -2 dB; noise-free speech: median -64 dB
